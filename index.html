<!DOCTYPE html>
<html lang="sl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Izziv Pečke - Lestvica vzponov</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- PapaParse za branje CSV podatkov -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <!-- FontAwesome za ikone -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* Uskladitev pisave in ozadja s sliko */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #eaf1ed;
        }

        /* Glavna bela kartica */
        .card-container {
            background-color: #ffffff;
            border-radius: 20px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.03);
        }

        /* Stil za gumba/zavihke (Pohod, Kolo, eKolo) */
        .tab-btn {
            background-color: #ffffff;
            border: 1px solid #e2e8f0;
            color: #475569;
            border-radius: 12px;
            font-weight: 600;
            transition: all 0.2s ease;
        }

        .tab-btn:hover {
            border-color: #cbd5e1;
            background-color: #f8fafc;
        }

        /* Aktivni zavihek - zelena obroba/stil */
        .tab-btn.active-tab {
            border: 2px solid #2e7d32;
            color: #2e7d32;
            background-color: #ffffff;
            font-weight: 700;
            box-shadow: 0 2px 4px rgba(46, 125, 50, 0.1);
        }

        /* Zeleni gumb v slogu "Lestvica" s slike */
        .btn-green-outline {
            border: 2px solid #2e7d32;
            color: #2e7d32;
            font-weight: 700;
            border-radius: 12px;
            background-color: #ffffff;
            transition: all 0.2s ease;
        }

        .btn-green-outline:hover {
            background-color: #f4fbf5;
        }

        /* Vnosna polja */
        .custom-input {
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            background-color: #ffffff;
            transition: all 0.2s ease;
        }

        .custom-input:focus {
            border-color: #2e7d32;
            box-shadow: 0 0 0 3px rgba(46, 125, 50, 0.15);
            outline: none;
        }
    </style>
</head>
<body class="text-slate-800 min-h-screen py-6 px-4 flex justify-center items-start">

    <!-- Glavni vsebnik v obliki kartice s slike -->
    <div class="card-container w-full max-w-xl p-6 md:p-8 my-auto">

        <!-- Glava / Header -->
        <header class="text-center mb-6">
            <h1 style="color: #2e7d32; font-size: 28px; font-weight: 800; margin-bottom: 12px; letter-spacing: -0.5px;">
                Izziv Pečke - lestvica
            </h1>
            <div>
                <a href="https://sandimobilno.github.io/Pecke-Vpis/" class="inline-flex items-center gap-2 px-5 py-2.5 text-sm font-semibold text-slate-600 bg-slate-100 hover:bg-slate-200 rounded-xl transition-colors">
                    <i class="fa-solid fa-arrow-left text-xs"></i> nazaj na vpis vzpona
                </a>
            </div>
        </header>

        <main>
            <!-- Zavihki (Način vzpona: Pohod, Kolo, eKolo) -->
            <div class="grid grid-cols-3 gap-3 mb-5">
                <button onclick="switchTab('pohodi')" id="tab-pohodi" class="tab-btn py-3 px-2 text-center text-sm md:text-base active-tab">
                    <i class="fa-solid fa-person-hiking mr-1.5 hidden sm:inline"></i>Pohod
                </button>
                <button onclick="switchTab('kolo')" id="tab-kolo" class="tab-btn py-3 px-2 text-center text-sm md:text-base">
                    <i class="fa-solid fa-bicycle mr-1.5 hidden sm:inline"></i>Kolo
                </button>
                <button onclick="switchTab('ekolo')" id="tab-ekolo" class="tab-btn py-3 px-2 text-center text-sm md:text-base">
                    <i class="fa-solid fa-bolt mr-1.5 hidden sm:inline"></i>eKolo
                </button>
            </div>

            <!-- Iskalnik -->
            <div class="mb-5">
                <div class="relative">
                    <input type="text" id="search-input" onkeyup="filterTable()" placeholder="Poišči po imenu ali priimku..." 
                           class="w-full pl-11 pr-4 py-3 custom-input text-slate-700 placeholder-slate-400 text-sm">
                    <i class="fa-solid fa-magnifying-glass absolute left-4 top-3.5 text-slate-400"></i>
                </div>
            </div>

            <!-- Tabela z rezultati -->
            <div class="bg-white rounded-2xl overflow-hidden border border-slate-200/80 shadow-sm">
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="bg-slate-50 text-slate-500 uppercase text-xs font-bold tracking-wider border-b border-slate-200">
                                <th class="py-3.5 px-3 text-center w-16">Uvr.</th>
                                <th class="py-3.5 px-3">Ime in priimek</th>
                                <th class="py-3.5 px-3 text-center">Vzponov</th>
                                <th class="py-3.5 px-3 text-right">Zadnji obisk</th>
                            </tr>
                        </thead>
                        <tbody id="table-body" class="divide-y divide-slate-100 text-sm">
                            <!-- Tukaj se naložijo podatki -->
                            <tr>
                                <td colspan="4" class="text-center py-8 text-slate-400">
                                    <i class="fa-solid fa-spinner fa-spin text-2xl mb-2"></i>
                                    <p>Nalaganje podatkov...</p>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <script>
        // === TUKAJ VSTAVITE VAŠE CSV POVEZAVE IZ GOOGLE SHEETS ===
        const CSV_URLS = {
            pohodi: "https://docs.google.com/spreadsheets/d/e/2PACX-1vSzaUc7g_ZJH6-iSxHZJYvWLxzFvEiEROXZyBU-a4mieLdjiOgJ52TQHl6Qzh38qmKVLEn_gnU3PmD6/pub?output=csv&gid=1188154452",
            kolo: "https://docs.google.com/spreadsheets/d/e/2PACX-1vSzaUc7g_ZJH6-iSxHZJYvWLxzFvEiEROXZyBU-a4mieLdjiOgJ52TQHl6Qzh38qmKVLEn_gnU3PmD6/pub?output=csv&gid=474770535",
            ekolo: "https://docs.google.com/spreadsheets/d/e/2PACX-1vSzaUc7g_ZJH6-iSxHZJYvWLxzFvEiEROXZyBU-a4mieLdjiOgJ52TQHl6Qzh38qmKVLEn_gnU3PmD6/pub?output=csv&gid=2059665635"
        };

        let currentData = [];
        let activeTab = 'pohodi';

        function switchTab(tab) {
            activeTab = tab;
            document.querySelectorAll('[id^="tab-"]').forEach(el => el.classList.remove('active-tab'));
            document.getElementById(`tab-${tab}`).classList.add('active-tab');
            document.getElementById('search-input').value = '';
            loadData(tab);
        }

        function loadData(tab) {
            const tbody = document.getElementById('table-body');
            tbody.innerHTML = `<tr><td colspan="4" class="text-center py-8 text-slate-400"><i class="fa-solid fa-spinner fa-spin text-2xl mb-2"></i><p>Nalaganje podatkov...</p></td></tr>`;

            const url = CSV_URLS[tab];
            if (!url || url.includes("TUKAJ_PASTE")) {
                tbody.innerHTML = `<tr><td colspan="4" class="text-center py-8 text-amber-600 font-medium">Prosimo, vstavite veljavno CSV povezavo v kodo programa!</td></tr>`;
                return;
            }

            Papa.parse(url, {
                download: true,
                header: false,
                skipEmptyLines: true,
                complete: function(results) {
                    processAndRenderData(results.data);
                },
                error: function(err) {
                    tbody.innerHTML = `<tr><td colspan="4" class="text-center py-8 text-red-500">Napaka pri nalaganju podatkov. Pridobivanje ni uspelo.</td></tr>`;
                }
            });
        }

        function processAndRenderData(rows) {
            // Izberemo le vrstice z uvrstitvijo IN vnesenim imenom ter priimkom
            const dataRows = rows.filter(row => {
                const imaUvrstitvov = row[0] && !isNaN(parseInt(row[0]));
                const imaIme = row[1] && row[1].trim() !== '';
                return imaUvrstitvov && imaIme;
            });
            currentData = dataRows;
            renderTable(currentData);
        }

        function renderTable(data) {
            const tbody = document.getElementById('table-body');
            tbody.innerHTML = '';

            if (data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4" class="text-center py-8 text-slate-400">Ni najdenih rezultatov.</td></tr>`;
                return;
            }

            data.forEach(row => {
                const uvrstitev = row[0] ? row[0].replace('.', '').trim() : '';
                const ime = row[1] || '';
                const vzponovRaw = row[2] ? row[2].trim() : '';
                const stVzponov = parseInt(vzponovRaw, 10) || 0;
                const zadnjiObisk = row[3] || '';

                let uvrstitevBadge = `<span class="text-slate-400">-</span>`;
                let vzponovBadge = `<span class="text-slate-400">-</span>`;

                // Prikaz uvrstitve in vzponov le, ko obstaja vsaj 1 vzpon (rezultat > 0)
                if (stVzponov > 0) {
                    vzponovBadge = `<span class="bg-emerald-100 text-emerald-800 text-xs font-bold px-2.5 py-1 rounded-full">${stVzponov}</span>`;

                    if (uvrstitev === '1') {
                        uvrstitevBadge = `<span class="inline-flex items-center justify-center w-7 h-7 bg-amber-100 text-amber-700 font-bold rounded-full">🥇 1</span>`;
                    } else if (uvrstitev === '2') {
                        uvrstitevBadge = `<span class="inline-flex items-center justify-center w-7 h-7 bg-slate-200 text-slate-700 font-bold rounded-full">🥈 2</span>`;
                    } else if (uvrstitev === '3') {
                        uvrstitevBadge = `<span class="inline-flex items-center justify-center w-7 h-7 bg-amber-800/10 text-amber-900 font-bold rounded-full">🥉 3</span>`;
                    } else {
                        uvrstitevBadge = `<span class="font-semibold text-slate-600">${uvrstitev}.</span>`;
                    }
                }

                const tr = document.createElement('tr');
                tr.className = 'hover:bg-slate-50 transition border-b border-slate-100';
                tr.innerHTML = `
                    <td class="py-3 px-3 text-center">${uvrstitevBadge}</td>
                    <td class="py-3 px-3 font-semibold text-slate-800">${ime}</td>
                    <td class="py-3 px-3 text-center">${vzponovBadge}</td>
                    <td class="py-3 px-3 text-right text-slate-500 text-xs">${zadnjiObisk}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        function filterTable() {
            const query = document.getElementById('search-input').value.toLowerCase();
            const filtered = currentData.filter(row => {
                const ime = (row[1] || '').toLowerCase();
                return ime.includes(query);
            });
            renderTable(filtered);
        }

        // Začetno nalaganje
        loadData('pohodi');
    </script>
</body>
</html>
