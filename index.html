<!DOCTYPE html>
<html lang="sl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Izziv Pečke - Lestvica</title>
  <style>
    :root {
      --primary-color: #10b981;
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #1e293b;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 20px;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 800px;
      background: var(--card-bg);
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
      padding: 24px;
    }

    /* Zavihki */
    .tabs {
      display: flex;
      border-bottom: 2px solid var(--border-color);
      margin-bottom: 20px;
    }

    .tab-btn {
      flex: 1;
      padding: 12px;
      border: none;
      background: none;
      font-size: 16px;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .tab-btn.active {
      color: var(--primary-color);
      border-bottom: 3px solid var(--primary-color);
      margin-bottom: -2px;
    }

    /* Iskalnik */
    .search-box {
      position: relative;
      margin-bottom: 20px;
    }

    .search-box input {
      width: 100%;
      padding: 12px 16px 12px 40px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s;
    }

    .search-box input:focus {
      border-color: var(--primary-color);
    }

    .search-icon {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
    }

    /* Tabela */
    .table-responsive {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }

    th {
      background-color: #f1f5f9;
      padding: 12px 16px;
      font-size: 13px;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    td {
      padding: 14px 16px;
      border-bottom: 1px solid var(--border-color);
      font-size: 15px;
    }

    tr:hover {
      background-color: #f8fafc;
    }

    .status-msg {
      text-align: center;
      padding: 30px;
      color: var(--text-muted);
      font-size: 15px;
    }

    .error-msg {
      color: #ef4444;
    }

    .email-cell {
      color: var(--text-muted);
      font-size: 13px;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Navigacijski Zavihki -->
    <div class="tabs">
      <button class="tab-btn active" onclick="spremeniZavihek('pohodi', this)">
        🚶 Pohodi
      </button>
      <button class="tab-btn" onclick="spremeniZavihek('kolo', this)">
        🚴 Kolo
      </button>
      <button class="tab-btn" onclick="spremeniZavihek('ekolo', this)">
        ⚡ eKolo
      </button>
    </div>

    <!-- Iskalnik -->
    <div class="search-box">
      <span class="search-icon">🔍</span>
      <input type="text" id="searchInput" placeholder="Poišči po imenu ali priimku..." onkeyup="filtrirajTabelo()">
    </div>

    <!-- Tabela -->
    <div class="table-responsive">
      <table>
        <thead>
          <tr>
            <th style="width: 60px;">UVR.</th>
            <th>IME IN PRIIMEK</th>
            <th style="width: 100px; text-align: center;">VZPONOV</th>
            <th>ZADNJI OBISK</th>
            <th>EMAIL</th>
          </tr>
        </thead>
        <tbody id="tabelaTelo">
          <tr>
            <td colspan="5" class="status-msg">Nalaganje podatkov...</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <script>
    // URL naslovi za posamezne liste (uporabite vaše obstoječe pubhtml povezave)
    const URLS = {
      pohodi: "https://docs.google.com/spreadsheets/d/e/2PACX-1vSzaUc7g_ZJH6-iSxHZJYvWLxzFvEIEROXZyBU-a4mieLdjiOgJ52TQHI6Qzh38qmKVLEn_gnU3PmD6/pubhtml?gid=0&single=true",
      kolo: "https://docs.google.com/spreadsheets/d/e/2PACX-1vSzaUc7g_ZJH6-iSxHZJYvWLxzFvEiEROXZyBU-a4mieLdjiOgJ52TQHl6Qzh38qmKVLEn_gnU3PmD6/pubhtml#gid=474770535",
      ekolo: "https://docs.google.com/spreadsheets/d/e/2PACX-1vSzaUc7g_ZJH6-iSxHZJYvWLxzFvEiEROXZyBU-a4mieLdjiOgJ52TQHl6Qzh38qmKVLEn_gnU3PmD6/pubhtml#gid=2059665635"
    };

    let trenutniPodatki = [];
    let trenutniTip = 'pohodi';

    // Ob prvem zagonu naložimo Pohode
    window.onload = () => {
      naloziPodatke('pohodi');
    };

    function spremeniZavihek(tip, gumb) {
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      gumb.classList.add('active');
      trenutniTip = tip;
      document.getElementById('searchInput').value = '';
      naloziPodatke(tip);
    }

    async function naloziPodatke(tip) {
      const telo = document.getElementById('tabelaTelo');
      telo.innerHTML = '<tr><td colspan="5" class="status-msg">Nalaganje podatkov...</td></tr>';

      try {
        let rawUrl = URLS[tip];
        
        if (!rawUrl || rawUrl.includes("TUKAJ_VAŠ")) {
          throw new Error("URL za ta zavihek še ni nastavljen.");
        }

        // Trik: Spremenimo pubhtml v CSV izvoz
        let csvUrl = rawUrl.replace("/pubhtml", "/pub").replace("single=true", "output=csv");
        if (!csvUrl.includes("output=csv")) {
          csvUrl += (csvUrl.includes("?") ? "&" : "?") + "output=csv";
        }

        const response = await fetch(csvUrl);
        if (!response.ok) throw new Error("Omrežna napaka pri nalaganju.");

        const csvText = await response.text();
        trenutniPodatki = pretvoriCSVvPolje(csvText);
        
        // Prikaz podatkov (preskočimo glavo tabele, če obstaja)
        prikaziPodatke(trenutniPodatki);

      } catch (err) {
        console.error(err);
        telo.innerHTML = `<tr><td colspan="5" class="status-msg error-msg">
          Napaka pri nalaganju podatkov. Preverite, ali je povezava pravilno nastavljena.
        </td></tr>`;
      }
    }

    function pretvoriCSVvPolje(text) {
      const vrstice = text.split("\n").filter(v => v.trim() !== "");
      return vrstice.map(vrstica => {
        // Enostaven regex za razbijanje CSV vrstic
        const celice = vrstica.match(/(".*?"|[^",\s]+)(?=\s*,|\s*$)/g) || vrstica.split(",");
        return celice.map(c => c.replace(/^"(.*)"$/, '$1').trim());
      });
    }

    function prikaziPodatke(podatki) {
      const telo = document.getElementById('tabelaTelo');
      telo.innerHTML = '';

      // Če so podatki prazni ali vsebujejo samo naslovno vrstico
      if (podatki.length <= 1) {
        telo.innerHTML = '<tr><td colspan="5" class="status-msg">Trenutno ni vpisov.</td></tr>';
        return;
      }

      // Preskočimo prvo vrstico (glavo tabele iz Google Sheet-a)
      const vrsticeZaPrikaz = podatki.slice(1);

      vrsticeZaPrikaz.forEach((vrstica) => {
        // Izberemo stolpce: Uvrstitev (0), Ime (1), Vzponov (2), Zadnji obisk (3), Email (4)
        const uvr = vrstica[0] || '';
        const ime = vrstica[1] || '';
        const vzponov = vrstica[2] || '0';
        const zadnjiObisk = vrstica[3] || '';
        const email = vrstica[4] || '';

        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td><strong>${uvr}</strong></td>
          <td>${ime}</td>
          <td style="text-align: center;"><strong>${vzponov}</strong></td>
          <td>${zadnjiObisk}</td>
          <td class="email-cell">${email}</td>
        `;
        telo.appendChild(tr);
      });
    }

    function filtrirajTabelo() {
      const vnos = document.getElementById('searchInput').value.toLowerCase();
      
      if (trenutniPodatki.length <= 1) return;

      const filtrirani = trenutniPodatki.slice(1).filter(vrstica => {
        const imePriimek = (vrstica[1] || '').toLowerCase();
        return imePriimek.includes(vnos);
      });

      // Ustvarimo strukturo z naslovno vrstico + filtriranimi podatki
      prikaziPodatke([trenutniPodatki[0], ...filtrirani]);
    }
  </script>

</body>
</html>
