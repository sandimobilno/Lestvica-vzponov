<script>
    const CSV_URLS = {
        pohodi: "https://docs.google.com/spreadsheets/d/e/2PACX-1vSzaUc7g_ZJH6-iSxHZJYvWLxzFvEiEROXZyBU-a4mieLdjiOgJ52TQHl6Qzh38qmKVLEn_gnU3PmD6/pub?output=csv&gid=1188154452",
        kolo: "https://docs.google.com/spreadsheets/d/e/2PACX-1vSzaUc7g_ZJH6-iSxHZJYvWLxzFvEiEROXZyBU-a4mieLdjiOgJ52TQHl6Qzh38qmKVLEn_gnU3PmD6/pub?output=csv&gid=474770535",
        ekolo: "https://docs.google.com/spreadsheets/d/e/2PACX-1vSzaUc7g_ZJH6-iSxHZJYvWLxzFvEiEROXZyBU-a4mieLdjiOgJ52TQHl6Qzh38qmKVLEn_gnU3PmD6/pub?output=csv&gid=2059665635"
    };

    let currentData = [];
    let activeTab = 'pohodi';

    function switchTab(tab) {
        activeTab = tab;
        document.querySelectorAll('[id^="tab-"]').forEach(el => el.classList.remove('active-tab'));
        document.getElementById(`tab-${tab}`).classList.add('active-tab');
        document.getElementById('search-input').value = '';
        loadData(tab);
    }

    function loadData(tab) {
        const tbody = document.getElementById('table-body');
        tbody.innerHTML = `<tr><td colspan="4" class="text-center py-8 text-slate-400"><i class="fa-solid fa-spinner fa-spin text-2xl mb-2"></i><p>Nalaganje podatkov...</p></td></tr>`;
        document.getElementById('total-sum-value').innerText = '0';

        const url = CSV_URLS[tab];
        if (!url || url.includes("TUKAJ_PASTE")) {
            tbody.innerHTML = `<tr><td colspan="4" class="text-center py-8 text-amber-600 font-medium">Prosimo, vstavite veljavno CSV povezavo v kodo programa!</td></tr>`;
            return;
        }

        Papa.parse(url, {
            download: true,
            header: false,
            skipEmptyLines: true,
            complete: function(results) {
                processAndRenderData(results.data);
            },
            error: function(err) {
                tbody.innerHTML = `<tr><td colspan="4" class="text-center py-8 text-red-500">Napaka pri nalaganju podatkov. Pridobivanje ni uspelo.</td></tr>`;
            }
        });
    }

    function processAndRenderData(rows) {
        const dataRows = rows.filter(row => {
            const imaUvrstitvov = row[0] && !isNaN(parseInt(row[0]));
            const imaIme = row[1] && row[1].trim() !== '';
            return imaUvrstitvov && imaIme;
        });
        currentData = dataRows;
        renderTable(currentData);
    }

    function renderTable(data) {
        const tbody = document.getElementById('table-body');
        tbody.innerHTML = '';

        if (data.length === 0) {
            tbody.innerHTML = `<tr><td colspan="4" class="text-center py-8 text-slate-400">Ni najdenih rezultatov.</td></tr>`;
            document.getElementById('total-sum-value').innerText = '0';
            return;
        }

        const nameCounts = {};
        data.forEach(row => {
            const ime = (row[1] || '').trim().toLowerCase();
            if (ime) nameCounts[ime] = (nameCounts[ime] || 0) + 1;
        });

        const now = new Date();
        const currentYear = now.getFullYear();
        const currentMonth = now.getMonth(); 
        const currentDay = now.getDate();

        const slovenskiMeseci = {
            'jan': 0, 'feb': 1, 'mar': 2, 'apr': 3, 'maj': 4, 'jun': 5,
            'jul': 6, 'avg': 7, 'sep': 8, 'okt': 9, 'nov': 10, 'dec': 11
        };

        let latestTodayIndex = -1;
        let maxMinutesFound = -1;
        
        // Zbirnik podatkov o tem, katere vrstice so današnje
        const todayFlags = data.map((row, index) => {
            const zadnjiObisk = row[3] || '';
            if (!zadnjiObisk) return false;
            
            const cleanStr = zadnjiObisk.toLowerCase();
            let isToday = false;

            for (let [mesecStr, mesecIdx] of Object.entries(slovenskiMeseci)) {
                if (cleanStr.includes(mesecStr)) {
                    const match = cleanStr.match(new RegExp(`(\\d{1,2})\\.?\\s*${mesecStr}`));
                    if (match && parseInt(match[1], 10) === currentDay && mesecIdx === currentMonth) {
                        isToday = true;
                    }
                    break;
                }
            }

            if (!isToday) {
                const parts = cleanStr.split(/[\.\-\/]\s*/);
                if (parts.length >= 3) {
                    const d = parseInt(parts[0].length === 4 ? parts[2] : parts[0], 10);
                    const m = parseInt(parts[1], 10) - 1;
                    const y = parseInt(parts[0].length === 4 ? parts[0] : parts[2], 10);
                    if (y === currentYear && m === currentMonth && d === currentDay) isToday = true;
                }
            }

            if (isToday) {
                const matchTime = zadnjiObisk.match(/(\d{1,2}):(\d{2})/);
                if (matchTime) {
                    const minutes = parseInt(matchTime[1], 10) * 60 + parseInt(matchTime[2], 10);
                    if (minutes > maxMinutesFound) {
                        maxMinutesFound = minutes;
                        latestTodayIndex = index;
                    }
                }
            }

            return isToday;
        });

        let totalVzponov = 0;

        data.forEach((row, index) => {
            const uvrstitev = row[0] ? row[0].replace('.', '').trim() : '';
            const uvrstitevNum = parseInt(uvrstitev, 10);
            const imeTekst = row[1] || '';
            const stVzponov = parseInt(row[2], 10) || 0;
            const zadnjiObisk = row[3] || '';
            const email = row[4] ? row[4].trim() : '';
            const isToday = todayFlags[index];

            totalVzponov += stVzponov;

            // Določitev stila za zadnji obisk
            let zadnjiObiskStyle = "text-right text-slate-500 text-[11px] sm:text-xs leading-tight whitespace-nowrap";
            if (index === latestTodayIndex) {
                zadnjiObiskStyle += " latest-today-visit";
            } else if (isToday) {
                zadnjiObiskStyle += " font-bold text-slate-900";
            }

            let cellImeContent = `<div>${imeTekst}</div>`;
            const imeClean = imeTekst.trim().toLowerCase();
            if (nameCounts[imeClean] > 1 && email) {
                cellImeContent += `<div class="text-slate-400 text-[11px] sm:text-xs font-normal mt-0.5">${email}</div>`;
            }

            let uvrstitevBadge = `<span class="text-slate-400">-</span>`;
            let vzponovBadge = `<span class="text-slate-400">-</span>`;

            if (stVzponov > 0) {
                vzponovBadge = `<span class="bg-emerald-100 text-emerald-800 text-[11px] sm:text-xs font-bold px-2 py-0.5 sm:px-2.5 sm:py-1 rounded-full">${stVzponov}</span>`;

                if (uvrstitev === '1') {
                    uvrstitevBadge = `<span class="inline-flex items-center justify-center min-w-[28px] h-7 px-1.5 bg-amber-100 text-amber-700 font-bold rounded-full text-base sm:text-lg">🥇 1</span>`;
                } else if (uvrstitev === '2') {
                    uvrstitevBadge = `<span class="inline-flex items-center justify-center min-w-[28px] h-7 px-1.5 bg-slate-200 text-slate-700 font-bold rounded-full text-base sm:text-lg">🥈 2</span>`;
                } else if (uvrstitev === '3') {
                    uvrstitevBadge = `<span class="inline-flex items-center justify-center min-w-[28px] h-7 px-1.5 bg-amber-800/10 text-amber-900 font-bold rounded-full text-base sm:text-lg">🥉 3</span>`;
                } else if (uvrstitevNum >= 4 && uvrstitevNum <= 10) {
                    uvrstitevBadge = `<span class="font-bold text-slate-700 text-sm sm:text-base">${uvrstitev}.</span>`;
                } else {
                    uvrstitevBadge = `<span class="font-semibold text-slate-600">${uvrstitev}.</span>`;
                }
            }

            let nameStyleClass = "font-semibold text-slate-800";
            if (!isNaN(uvrstitevNum)) {
                if (uvrstitevNum >= 1 && uvrstitevNum <= 3) {
                    nameStyleClass = "font-bold text-slate-900 text-sm sm:text-base";
                } else if (uvrstitevNum >= 4 && uvrstitevNum <= 10) {
                    nameStyleClass = "font-bold text-slate-800 text-xs sm:text-sm";
                }
            }

            let borderClass = 'border-b border-slate-100';
            if (!isNaN(uvrstitevNum) && (uvrstitevNum === 3 || uvrstitevNum % 10 === 0)) {
                borderClass = 'border-b border-slate-300';
            }

            const tr = document.createElement('tr');
            tr.className = `hover:bg-slate-50 transition ${borderClass}`;
            tr.innerHTML = `
                <td class="py-2.5 px-1.5 sm:px-3 text-center whitespace-nowrap">${uvrstitevBadge}</td>
                <td class="py-2.5 px-1.5 sm:px-3 ${nameStyleClass} leading-tight">${cellImeContent}</td>
                <td class="py-2.5 px-1.5 sm:px-3 text-center whitespace-nowrap">${vzponovBadge}</td>
                <td class="py-2.5 px-1.5 sm:px-3 ${zadnjiObiskStyle}">${zadnjiObisk}</td>
            `;
            tbody.appendChild(tr);
        });

        document.getElementById('total-sum-value').innerText = totalVzponov;
    }

    function filterTable() {
        const query = document.getElementById('search-input').value.toLowerCase();
        const filtered = currentData.filter(row => {
            const ime = (row[1] || '').toLowerCase();
            return ime.includes(query);
        });
        renderTable(filtered);
    }

    document.addEventListener('DOMContentLoaded', () => {
        loadData('pohodi');
    });
</script>
